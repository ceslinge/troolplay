# Dependabot surveille les dépendances (#56) : une fois par mois, une seule PR par
# écosystème, qui regroupe toutes les mises à jour, majeures comprises. À relire avant
# de merger : une version majeure peut demander des changements.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      tout:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    groups:
      tout:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      tout:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend, /deploy]
    schedule:
      interval: monthly
    groups:
      tout:
        patterns: ["*"]
