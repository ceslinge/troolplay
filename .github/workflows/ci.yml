name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: troolplay
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: troolplay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U troolplay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_USER: troolplay
      POSTGRES_PASSWORD: ci-only
      POSTGRES_DB: troolplay
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      # Code mort : réglages dans pyproject.toml ([tool.vulture]).
      - run: uv run vulture
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Code mort (knip.jsonc), puis copier-coller du site et du backend (.jscpd.json) :
      # au-dessus du seuil, en % de lignes dupliquées, on partage au lieu de recopier. Le seuil ne fait que baisser.
      - run: npm run dead-code
      - run: npm run duplicates
      - run: npm run build

  # Les images de production se construisent : un déploiement ne casse pas par surprise.
  images:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: troolplay
      POSTGRES_PASSWORD: ci-only
      POSTGRES_DB: troolplay
      SITE_DOMAIN: localhost
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f compose.prod.yaml build