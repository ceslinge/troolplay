[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Camesl", email = "199947383+ceslinge@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.3.1,<0.4",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "tzdata>=2026.6",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "vulture>=2.16",
]

# Le code mort (CI). À 80 %, vulture ne signale que ce qui est sûr : les routes FastAPI et
# les champs Pydantic ou SQLAlchemy, lus par les bibliothèques, ne passent pas pour morts.
[tool.vulture]
paths = ["src", "tests", "migrations"]
min_confidence = 80
